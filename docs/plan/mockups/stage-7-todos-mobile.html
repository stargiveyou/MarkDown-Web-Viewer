<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todos Mobile Mockup</title>
<link rel="stylesheet" href="mock.css">
<style>
  body { width: 390px; height: 844px; overflow: hidden; position: relative; }
  .m-hdr { height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  .m-proj { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; font-size: 14px; }
  .m-wrap { padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }
  .m-tabs { display: flex; gap: 6px; overflow: hidden; }
  .m-tab { white-space: nowrap; border: 1px solid var(--line2); border-radius: 999px; padding: 4px 11px; font-size: 12px; color: var(--t3); display: inline-flex; gap: 5px; align-items: center; }
  .m-tab.on { background: var(--t1); color: #09090b; border-color: var(--t1); font-weight: 600; }
  .banner { padding: 9px 11px; }
  .banner .t { font-size: 12px; }
  .row { padding: 10px 4px; border-bottom: 1px solid var(--line); border-radius: 0; }
  .row .tx { font-size: 14px; }
  .m-add { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px 26px; background: linear-gradient(180deg, rgba(9,9,11,0), #09090b 30%); }
  .m-add-in { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line2); background: var(--card); border-radius: 14px; padding: 11px 12px; color: var(--t4); }
  .m-add-in .go { margin-left: auto; width: 30px; height: 30px; border-radius: 9px; background: var(--amber2); color: #09090b; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="back" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
  <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="cal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
  <symbol id="file" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8M16 17H8"/></symbol>
  <symbol id="folder" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
  <symbol id="list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  <symbol id="kanban" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 7v7M12 7v4M16 7v9"/></symbol>
  <symbol id="bot" viewBox="0 0 24 24"><path d="M12 8V4H8"/><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/></symbol>
  <symbol id="play" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></symbol>
  <symbol id="undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
  <symbol id="ext" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
  <symbol id="sub" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></symbol>
  <symbol id="down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="hist" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
</svg>

<header class="m-hdr">
  <span class="iconbtn" style="padding:5px"><svg class="i"><use href="#back"/></svg></span>
  <span class="m-proj">Vx-Unity-Golf-Dev <svg class="i sm" style="color:var(--t4)"><use href="#down"/></svg></span>
  <span class="spacer"></span>
  <span class="seg"><span class="on" style="padding:5px 8px"><svg class="i sm"><use href="#list"/></svg></span><span style="padding:5px 8px"><svg class="i sm"><use href="#kanban"/></svg></span></span>
  <span class="btn-amber" style="padding:6px 8px"><svg class="i sm"><use href="#play"/></svg></span>
</header>

<div class="m-wrap">
  <div class="m-tabs">
    <span class="m-tab on">오늘 2</span>
    <span class="m-tab">예정 5</span>
    <span class="m-tab" style="color:var(--violet);border-color:rgba(167,139,250,.45)">검토 필요 2</span>
    <span class="m-tab">전체 9</span>
    <span class="m-tab">완료</span>
  </div>

  <div class="banner">
    <span class="ico" style="width:26px;height:26px"><svg class="i"><use href="#bot"/></svg></span>
    <div class="t"><b>18:00 자동 완료</b><br><span class="ok">✓ 3건 완료</span> · <span class="rv">? 2건 검토 필요</span></div>
    <span class="spacer"></span>
    <svg class="i" style="color:var(--t4)"><use href="#right"/></svg>
  </div>

  <div>
    <div class="row">
      <span class="chk p0"></span>
      <div>
        <div class="tx">PWA 매니페스트 미들웨어 예외 추가</div>
        <div class="meta"><span class="due over"><svg class="i sm"><use href="#cal"/></svg>어제</span><span class="tag">#security</span></div>
      </div>
    </div>
    <div class="row">
      <span class="chk doing"></span>
      <div>
        <div class="tx">FTS 색인 재구축 스크립트 정리</div>
        <div class="meta"><span class="pill amber">진행 중</span><span class="tag">#backend</span></div>
      </div>
    </div>
    <div class="row">
      <span class="chk review">?</span>
      <div style="flex:1">
        <div class="tx">업로드 알림 문구 수정</div>
        <div class="meta"><span class="ai"><svg class="i sm"><use href="#bot"/></svg>완료 추정 72%</span></div>
        <div class="rv-actions" style="margin-top:8px"><span class="approve"><svg class="i sm"><use href="#check"/></svg>승인</span><span class="reject"><svg class="i sm"><use href="#undo"/></svg>반려</span></div>
      </div>
    </div>
    <div class="row">
      <span class="chk p1"></span>
      <div>
        <div class="tx">칸반 보드 페이지 추가</div>
        <div class="meta"><span class="due"><svg class="i sm"><use href="#cal"/></svg>10월 20일</span><span><svg class="i sm"><use href="#sub"/></svg>1/2</span><span class="ai"><svg class="i sm"><use href="#bot"/></svg>58%</span></div>
      </div>
    </div>
    <div class="row done">
      <span class="chk done"><svg class="i sm"><use href="#check"/></svg></span>
      <div>
        <div class="tx">폴더 ZIP 다운로드 웹 UI 노출</div>
        <div class="meta"><span class="ai"><svg class="i sm"><use href="#bot"/></svg>자동 완료</span><span style="color:var(--t3)"><svg class="i sm"><use href="#undo"/></svg>되돌리기</span></div>
      </div>
    </div>
  </div>
</div>

<div class="m-add">
  <div class="m-add-in">
    <svg class="i"><use href="#plus"/></svg>내일 p1 #ui 리뷰 반영
    <span class="go"><svg class="i"><use href="#check"/></svg></span>
  </div>
</div>
</body>
</html>
